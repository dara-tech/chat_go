name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server_bin ./cmd/server/main.go

      - name: Copy binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/server_bin"
          target: "/opt/chat_go/"
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # ── Install MySQL if missing ──────────────────────────
            if ! command -v mysql &>/dev/null; then
              echo "Installing MySQL..."
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server
              systemctl enable mysql
              systemctl start mysql
              mysql -u root <<SQL
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'password123';
            CREATE DATABASE IF NOT EXISTS chat_go_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            FLUSH PRIVILEGES;
            SQL
              echo "✅ MySQL ready"
            fi

            # ── Write .env (strip leading spaces from each line) ──
            mkdir -p /opt/chat_go
            printf '%s\n' '${{ secrets.ENV_FILE }}' | sed 's/^[[:space:]]*//' > /opt/chat_go/.env
            echo "--- .env content ---"
            cat /opt/chat_go/.env
            echo "--------------------"

            # ── Make binary executable ────────────────────────────
            chmod +x /opt/chat_go/server_bin

            # ── Create systemd service ────────────────────────────
            cat > /etc/systemd/system/chat_go.service <<EOF
[Unit]
Description=Chat Go Server
After=network.target mysql.service
Requires=mysql.service

[Service]
Type=simple
WorkingDirectory=/opt/chat_go
EnvironmentFile=/opt/chat_go/.env
ExecStart=/opt/chat_go/server_bin
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF

            # ── Reload and restart service ────────────────────────
            systemctl daemon-reload
            systemctl enable chat_go
            systemctl restart chat_go

            sleep 3
            systemctl status chat_go --no-pager || true
            echo "--- Last 30 log lines ---"
            journalctl -u chat_go -n 30 --no-pager || true
            echo "✅ Deploy script done"

